spring.application.name=vehicle-service-centre
server.port=8080

spring.datasource.url=jdbc:mysql://${VSC_DB_HOST:127.0.0.1}:${VSC_DB_PORT:3307}/${VSC_DB_NAME:vsc_job_card}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${VSC_DB_USERNAME:vsc_app}
spring.datasource.password=${VSC_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=true
